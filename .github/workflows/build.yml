name: Build signed APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          unzip -q Weather.zip
          cd Weather
          chmod +x gradlew
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$(command -v sdkmanager || echo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          ./gradlew assembleRelease --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" \
            Weather/app/build/outputs/apk/release/app-release.apk \
            --title "Weather build ${{ github.run_number }}" --notes "Signed release APK"
